# Render Blueprint — 一键部署 agy2api 到 Render（默认 Free / 无磁盘）
#
# 使用方法：
#   1. 将本仓库推送到 GitHub/GitLab
#   2. Render 控制台 → New → Blueprint → 选择该仓库
#   3. 首次部署会提示填写 sync:false 的密钥变量（面板密码、OAuth 客户端
#      凭据、Antigravity 凭据、代理等）
#
# 计划说明（默认 Free / 无磁盘）：
#   - Free 计划 512MB 内存、无持久磁盘：容器重启 / 重新部署 / 15 分钟
#     无流量休眠后，SQLite 中的面板配置、请求日志与已导入凭据全部清空。
#     重启就重启 —— 凭据放在环境变量里，每次启动自动重建（幂等注入）。
#   - 账号凭据请用 CREDENTIALS_JSON 注入：单个变量放 JSON 数组可带
#     多条，超出长度限制用 CREDENTIALS_JSON_2、_3 ... 分批；重启后
#     自动恢复，无需磁盘。格式与面板导入一致：
#       [{"refresh_token": "...", "email": "...", "tier": "...", "project_id": "..."}]
#     （仅 refresh_token 必填，其余字段自动获取）
#   - 面板里的配置修改不持久 —— 需要固化的配置（密码、IP 白名单、模型
#     复写等）请用对应环境变量下发；或配置 POSTGRESQL_URI 指向外部
#     PostgreSQL，配置与日志全部持久化。
#   - 512MB 内存可正常部署：本服务为纯 Python（无浏览器/无本地签名引擎）。
#   - Free 计划 15 分钟无入站流量会休眠：部署完成后把 KEEPALIVE_URL
#     填成 https://<你的服务名>.onrender.com/healthz 即可周期自我唤醒
#     （间隔 KEEPALIVE_INTERVAL，默认 60s）。
#   - 需要持久磁盘与服务常驻时：plan 改回 starter，并恢复下方注释中的
#     disk 段。

services:
  - type: web
    name: agy2api
    runtime: docker
    plan: free
    region: oregon
    branch: master
    autoDeploy: true
    healthCheckPath: /healthz

    # 持久磁盘（Free 计划不支持；starter 及以上取消注释即可启用，
    # 挂载后 SQLite 凭据库与面板配置跨重启保留，可不再依赖
    # CREDENTIALS_JSON 注入）：
    # disk:
    #   name: agy2api-data
    #   mountPath: /app/creds
    #   sizeGB: 1

    # 监听端口由 Render 注入的 PORT 环境变量决定（web.py 已优先读取，
    # 镜像内置 HOST=0.0.0.0，无需额外配置）。
    envVars:
      # 出站保活：定期 GET 目标 URL 自我唤醒，防闲置实例冻结。
      # 部署拿到域名后填 https://<你的服务名>.onrender.com/healthz。
      - key: KEEPALIVE_URL
        sync: false
      # 保活请求间隔（秒，默认 60，下限 5）
      - key: KEEPALIVE_INTERVAL
        value: "60"
      # 【必填】Web 管理面板登录密码 —— 公网部署务必设置，否则面板裸奔
      - key: PANEL_PASSWORD
        sync: false
      # 【推荐】API 调用密码（OpenAI / Gemini / Claude 兼容端点鉴权，
      # 防接口被白嫖）
      - key: API_PASSWORD
        sync: false
      # 【必填】Antigravity OAuth 客户端凭据（从 Antigravity CLI 获取，
      # OAuth 登录与凭据 refresh 均依赖）
      - key: ANTIGRAVITY_CLIENT_ID
        sync: false
      - key: ANTIGRAVITY_CLIENT_SECRET
        sync: false
      # 【推荐】凭据注入（免磁盘，重启自动恢复）。
      # JSON 数组（多条）或对象（单条）；仅 refresh_token 必填，例：
      #   [{"refresh_token": "1//0abc...", "email": "a@gmail.com"}]
      - key: CREDENTIALS_JSON
        sync: false
      # 【可选】更多凭据分批注入（CREDENTIALS_JSON_2、_3 ... 逐条追加）
      - key: CREDENTIALS_JSON_2
        sync: false
      # 【可选】出站代理（http:// 或 socks5://），Google 风控严格时使用
      # 例: socks5://user:pass@host:port
      - key: PROXY
        sync: false
      # 【可选】外部 PostgreSQL（设置后面板配置与请求日志跨重启持久化，
      # Free 无磁盘部署的推荐搭配）
      # 例: postgresql://user:pass@host:5432/agy2api
      - key: POSTGRESQL_URI
        sync: false
